name: Quality

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Rust and black-box quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo artifacts
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}-${{ hashFiles('src/**/*.rs', 'tests/**/*.rs', 'Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}-
            ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check whitespace
        run: git diff --check

      - name: Run Clippy with warnings denied
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run all-target tests
        run: cargo test --all-targets

      - name: Build release binary
        run: cargo build --release

      - name: Check installer syntax
        run: bash -n install.sh

      - name: Check benchmark Python syntax
        run: python3 -m py_compile tools/benchmark_remote_acquisition.py

      - name: Audit Rust dependencies
        run: |
          cargo install --locked cargo-audit
          cargo audit

      - name: Run deterministic remote-acquisition benchmark
        run: python3 tools/benchmark_remote_acquisition.py --binary target/release/gitrecon --repetitions 1

      - name: Remove generated residues
        if: always()
        run: |
          rm -rf tools/__pycache__
          find . -maxdepth 1 -type f -name '.gitrecon-custom-pattern-*.json' -delete
          git diff --check
