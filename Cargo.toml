[package]
name = "gitrecon"
version = "3.2.8"
edition = "2021"
description = "GitRecon — Streaming Git Exposure Scanner (Rust rewrite)"
authors = ["GitRecon Contributors"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/HazaVVIP/GitRecon"
keywords = ["git", "security", "reconnaissance", "secrets", "scanner"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "gitrecon"
path = "src/main.rs"

[dependencies]
# Async runtime
tokio = { version = "1.44", features = ["full"] }
futures = "0.3"
async-trait = "0.1"

# HTTP client
reqwest = { version = "0.12", features = ["json", "socks", "rustls-tls", "gzip", "deflate", "stream"], default-features = false }
bytes = "1.11"

# Error handling
anyhow = "1.0"

# CLI
clap = { version = "4.5", features = ["derive"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# Regex
regex = "1.11"
lazy_static = "1.5"
once_cell = "1.20"

# Compression
flate2 = "1.1"

# Hashing
sha1 = "0.10"
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"

# Terminal colors
colored = "3.0"
terminal_size = "0.4"

# Progress bar
indicatif = "0.17"

# Random
rand = "0.9"

# Date/time
chrono = { version = "0.4", features = ["serde"] }

# Parallel iteration
rayon = "1.10"

# Base64 (GitHub API blob decoding)
base64 = "0.22"

# Logging
log = "0.4"
env_logger = "0.11"

# Checkpoint & Resume (R-1)
dirs = "5.0"

# SEC-004: Signal handling for cleanup
# Sprint 5 (S5.8): gated to Unix — signal-hook-tokio pulls tokio::net::UnixStream
# which fails to compile on Windows. On Windows the signal-handler task in
# main.rs is a no-op and Ctrl-C reaches the process via the default OS handler.
[target.'cfg(unix)'.dependencies]
signal-hook = "0.3"
signal-hook-tokio = { version = "0.3", features = ["futures-v0_3"] }

# Binary File Scanning (S-3)
rusqlite = "0.32"
zip = "2.2"
r2d2 = "0.8"
r2d2_sqlite = "0.25"
subtle = "2.6"

# URL validation
url = "2.5"

# SEC-007 / TTY layout: libc used across checkpoint.rs (getuid) and layout.rs
# (TIOCGWINSZ). Both are Unix-only APIs but the crate itself builds on Windows
# (empty stub), so keep it unconditional here to avoid a `no libc found` error.
libc = "0.2"

# DEADLOCK FIX: Fair mutex for high-concurrency cache operations
parking_lot = "0.12"

[dev-dependencies]
# Testing utilities
tempfile = "3.13"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
